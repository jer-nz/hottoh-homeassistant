name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install
        run: uv sync --group test
      - name: Lint
        run: |
          uv run ruff check custom_components tests tools
          uv run ruff format --check custom_components tests tools
      - name: Tests
        run: uv run pytest -q
